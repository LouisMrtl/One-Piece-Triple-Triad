<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Piece Triple Triad — Menu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-menu">

  <div class="topbar">
    <div class="captain">
      <img class="flag-thumb" id="captainFlag" src="" alt="Pavillon du capitaine">
      <div class="captain-copy">
        <div class="captain-name" id="captainName">—</div>
        <div class="small">Capitaine</div>
        <div class="rank-label" id="captainRank">Rang : Moussaillon</div>
      </div>
    </div>
    <button class="denden-btn" id="resetBtn" title="Changer de profil"></button>
  </div>

    <div class="container crew-footer-spacer">

    <div id="modeSelectView" class="menu-dashboard">
      <header class="menu-heading">
        <h1>Menu principal</h1>
      </header>
      <div class="menu-layout">
        <section class="main-menu-actions" aria-label="Modes de jeu">
          <div class="section-heading"><span>Modes de jeu</span></div>
          <div class="mode-grid">
          <button class="mode-action" id="onlineModeBtn" title="Battle Online"><span class="mode-action-icon">01</span><span>Battle Online</span><small>Bientôt disponible</small></button>
          <button class="mode-action" id="coliseumModeBtn" title="Colisée"><span class="mode-action-icon">02</span><span>Colisée</span><small>Bientôt disponible</small></button>
          <button class="mode-action" id="storyModeBtn" title="Mode Histoire"><span class="mode-action-icon">03</span><span>Mode Histoire</span><small>Progression narrative</small></button>
          <button class="mode-action" id="randomModeBtn" title="Random Battle"><span class="mode-action-icon">04</span><span>Random Battle</span><small>Combat immédiat</small></button>
          <button class="mode-action" id="charactersModeBtn" title="Collection Personnages"><span class="mode-action-icon">05</span><span>Collection</span><small>Cartes découvertes</small></button>
          </div>
        </section>
        <aside class="progress-column" aria-label="Progression">
          <div class="section-heading"><span>Progression</span><small>CAPITAINE</small></div>
          <img class="progress-ship" id="progressShip" src="" alt="">
          <strong id="progressLevel">Niv. 1</strong>
          <span class="progress-caption">Niveau du navire</span>
        </aside>
      </div>
    </div>

    <div id="storySelectView" class="hidden">
      <div style="display:flex;align-items:center;gap:12px;margin-top:32px;">
        <button class="ghost" id="backToModesBtn">← Retour</button>
        <h2 style="margin:0;">Mode Histoire</h2>
        <button class="debug-button" id="unlockAllBtn" type="button">Tout débloquer</button>
      </div>
      <div id="sagaList"></div>
    </div>
  </div>
    <footer class="crew-footer" id="crewFooter">
    <div class="crew-footer-track" id="crewFooterTrack"></div>
  </footer>
    <div class="confirm-overlay hidden" id="confirmOverlay">
      <div class="panel confirm-panel">
        <p id="confirmMessage">Voulez-vous vraiment retirer ce personnage ?</p>
        <div class="confirm-actions">
          <button class="image-ui-button" id="confirmCancel" type="button"><img src="images/characters/btncancel.png" alt="Annuler"></button>
          <button class="image-ui-button" id="confirmAccept" type="button"><img src="images/characters/btnacept.png" alt="Confirmer"></button>
        </div>
      </div>
    </div>

<script src="js/data/data-cards.js"></script>
<script src="js/data/data-crew.js"></script>
<script src="js/data/data-flags.js"></script>
<script src="js/data/data-arcs.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/storage.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
