<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Piece Triple Triad — Menu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-menu">

  <div class="topbar">
    <div class="captain">
      <img class="flag-thumb" id="captainFlag" src="" alt="Pavillon">
      <div class="captain-copy">
        <div class="captain-name" id="captainName">—</div>
        <div class="small">Capitaine</div>
      </div>
    </div>
    <button class="denden-btn" id="resetBtn" title="Changer de profil"></button>
  </div>

    <div class="container crew-footer-spacer">

    <div id="modeSelectView">
      <section class="player-status" aria-label="Progression du joueur">
        <img class="ship-icon" id="captainShip" src="" alt="Niveau du bateau">
        <div>
          <div class="status-label">Progression du capitaine</div>
          <strong id="shipLevel">Niveau 1</strong>
          <div id="wantedBounty">0 B</div>
        </div>
      </section>
      <section class="wanted-panel" aria-label="Avis de recherche">
        <img class="wanted-poster" src="images/characters/wanted.png" alt="Avis de recherche">
        <img class="wanted-flag" id="wantedFlag" src="" alt="Drapeau du capitaine">
        <strong class="wanted-value" id="wantedPosterBounty">0</strong>
      </section>
      <div class="mode-grid image-mode-grid">
        <button class="image-mode-button" id="onlineModeBtn" title="Battle Online"><img src="images/characters/btnbattleonlinenew.png" alt="Battle Online"></button>
        <button class="image-mode-button" id="charactersModeBtn" title="Collection Personnages"><img src="images/characters/btncharactersnew.png" alt="Collection Personnages"></button>
        <button class="image-mode-button" id="coliseumModeBtn" title="Colisée"><img src="images/characters/btncoliseumnew.png" alt="Colisée"></button>
        <button class="image-mode-button" id="storyModeBtn" title="Mode Histoire"><img src="images/characters/btnhistorynew.png" alt="Mode Histoire"></button>
        <button class="image-mode-button" id="randomModeBtn" title="Random Battle"><img src="images/characters/btnrandombattlenew.png" alt="Random Battle"></button>
      </div>
    </div>

    <div id="storySelectView" class="hidden">
      <div style="display:flex;align-items:center;gap:12px;margin-top:32px;">
        <button class="ghost" id="backToModesBtn">← Retour</button>
        <h2 style="margin:0;">Mode Histoire</h2>
      </div>
      <div id="sagaList"></div>
    </div>
  </div>
    <footer class="crew-footer" id="crewFooter">
    <div class="crew-footer-track" id="crewFooterTrack"></div>
  </footer>

<script src="js/data/data-cards.js"></script>
<script src="js/data/data-crew.js"></script>
<script src="js/data/data-flags.js"></script>
<script src="js/data/data-arcs.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/storage.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
